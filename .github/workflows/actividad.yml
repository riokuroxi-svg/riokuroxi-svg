# ═══════════════════════════════════════════════════════════════════
#  actividad.yml — la franja «ACTIVIDAD · 12 SEMANAS» se pone al día sola.
#
#  El problema que resuelve: la cifra de esa franja («+248 %») es un dato
#  vivo, no una decisión de diseño. Escrita a mano envejece en silencio
#  —llegó a decir «+38 %» durante meses—. Aquí se recalcula desde la API
#  de GitHub cada lunes y solo se commitea si el número cambió de verdad.
#
#  Sin servicios de terceros: los commits se cuentan con la API pública y
#  los dibuja tools/build_assets.py, igual que el resto del perfil.
#
#  Si la API falla o da límite de cuota, tools/estadisticas.py sale con
#  error y NO se escribe nada: es preferible una cifra de la semana pasada
#  a una cifra inventada. El JSON se guarda en el repo justo para eso.
# ═══════════════════════════════════════════════════════════════════
name: actividad

on:
  schedule:
    # Lunes a las 06:17 UTC (00:17 en Ciudad de México). La hora no es
    # redonda a propósito: los cron de GitHub se atascan en los :00.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actividad
  cancel-in-progress: true

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias (Pillow, fontTools y el kanji 反魂)
        run: |
          python -m pip install --upgrade pip
          # numpy: preparar_arte.py lo necesita para las imágenes. Faltaba
          # aquí desde el 10 de noviembre y el workflow llevaba fallando en
          # silencio en cada push.
          pip install pillow fonttools numpy
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - name: Contar los commits de las últimas 12 semanas
        env:
          # El token del propio workflow: 5.000 peticiones/hora en vez de 60.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/estadisticas.py

      - name: Redibujar la franja
        run: python tools/build_assets.py stats

      - name: Comprobar que la franja no enlaza nada de fuera
        run: |
          if grep -REn "href=\"https?://" assets/stats.svg | grep -v "<a "; then
            echo "::error::La franja de actividad enlaza recursos externos."
            exit 1
          fi

      - name: Commit si el número cambió
        run: |
          # `git status` incluye tools/estadisticas.json y assets/stats.svg.
          # Si las 12 semanas son las mismas, no hay diff y no hay commit:
          # el historial se queda limpio y no se dispara el workflow perfil.
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "riokuroxi-svg"
            git config user.email "riokuroxi-svg@users.noreply.github.com"
            git add tools/estadisticas.json assets/stats.svg
            git commit -m "chore(actividad): cifras de las 12 semanas al día [skip ci]"
            # El workflow perfil puede commitear a la vez que este (los dos
            # redibujan assets/). Si el push se rechaza, se rebobina sobre lo
            # que haya arriba y se reintenta en vez de dejar el run en rojo.
            for intento in 1 2 3; do
              if git push; then
                break
              fi
              echo "Push rechazado (intento $intento): rebobinando sobre origin/main…"
              git pull --rebase --autostash --quiet origin main
              sleep $((intento * 5))
            done
          else
            echo "Misma actividad que la semana pasada: no se toca nada."
          fi
